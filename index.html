    background-clip: text;
    color: transparent;
  }
  .card {

    border-radius: 6px;
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  }

  }
  .node {
    width: 48px; height: 48px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: var(--bg);
    color: var(--c);
    border: 1.5px solid color-mix(in srgb, var(--c) 60%, transparent);
    transition: box-shadow .3s ease, background .3s ease;
  }
  .node.is-active {
    background: color-mix(in srgb, var(--c) 16%, var(--bg));
    box-shadow: 0 0 0 5px color-mix(in srgb, var(--c) 14%, transparent), 0 0 28px color-mix(in srgb, var(--c) 60%, transparent);
  }

    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1;
    padding: 6px 9px;
    border-radius: 3px;
    color: color-mix(in srgb, var(--c) 85%, white);
    background: color-mix(in srgb, var(--c) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--c) 28%, transparent);
    transition: background .2s ease, transform .2s ease;
  }
  .chip:hover { background: color-mix(in srgb, var(--c) 22%, transparent); transform: translateY(-1px); }
  .group-label {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--c);
  }
  .nav-chip {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: .04em;
    padding: 9px 12px;
    border-radius: 4px;
    color: var(--fg);
    background: color-mix(in srgb, var(--c) 8%, transparent);
    border: 1px solid color-mix(in srgb, var(--c) 40%, transparent);

  .nav-chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
  button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
  .body-open { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .3s ease; }

  .body-inner { overflow: hidden; min-height: 0; }
  .spine-fill { background: linear-gradient(180deg, var(--cyan), var(--violet) 50%, var(--matrix)); box-shadow: 0 0 12px color-mix(in srgb, var(--cyan) 70%, transparent); }

  .caret.open { transform: rotate(180deg); }
